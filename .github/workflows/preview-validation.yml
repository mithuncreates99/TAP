name: Validate portfolio preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - "thelma-executive-portfolio-github-ready/**"
      - ".github/workflows/preview-validation.yml"

permissions:
  contents: read

concurrency:
  group: "portfolio-preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: thelma-executive-portfolio-github-ready
        run: npm install --no-audit --no-fund

      - name: Build preview
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run build

      - name: Install Chromium for browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npx playwright install chromium

      - name: Run portfolio browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run test:e2e
