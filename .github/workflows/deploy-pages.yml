name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "thelma-executive-portfolio-github-ready/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: thelma-executive-portfolio-github-ready
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run build

      - name: Install Chromium for browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npx playwright install --with-deps chromium

      - name: Run portfolio browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: thelma-executive-portfolio-github-ready/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
