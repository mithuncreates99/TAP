name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "thelma-executive-portfolio-github-ready/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: thelma-executive-portfolio-github-ready
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run build

      - name: Install Chromium for browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npx playwright install chromium

      - name: Run portfolio browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run test:e2e

      - name: Checkout independent portfolio preview
        uses: actions/checkout@v4
        with:
          ref: preview/independent-public-demos
          path: preview-src

      - name: Build and test the independent preview
        working-directory: preview-src/thelma-executive-portfolio-github-ready
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          npm run build
          npm run test:e2e

      - name: Add the no-index preview route to the Pages artifact
        run: |
          mkdir -p thelma-executive-portfolio-github-ready/dist/preview
          cp -a preview-src/thelma-executive-portfolio-github-ready/dist/. thelma-executive-portfolio-github-ready/dist/preview/
          python - <<'PY'
          from pathlib import Path

          page = Path("thelma-executive-portfolio-github-ready/dist/preview/index.html")
          html = page.read_text()
          marker = '<meta name="robots" content="noindex, nofollow" />'
          if marker not in html:
              html = html.replace("</head>", f"    {marker}\\n  </head>")
          page.write_text(html)
          Path("thelma-executive-portfolio-github-ready/dist/preview/PREVIEW-ONLY.txt").write_text(
              "Review-only portfolio preview. The live homepage remains at /TAP/.\\n"
          )
          PY

      - name: Checkout the pre-redesign portfolio for the classic route
        uses: actions/checkout@v4
        with:
          ref: 80bcf934f9b6a2f981ce8266de531f5ec2363587
          path: classic-src

      - name: Install classic portfolio dependencies
        working-directory: classic-src/thelma-executive-portfolio-github-ready/
        run: npm install --no-audit --no-fund

      - name: Build classic portfolio
        working-directory: classic-src/thelma-executive-portfolio-github-ready/
        run: npm run build

      - name: Add the classic portfolio to the production artifact
        run: |
          mkdir -p thelma-executive-portfolio-github-ready/dist/classic
          cp -a classic-src/thelma-executive-portfolio-github-ready/dist/. thelma-executive-portfolio-github-ready/dist/classic/
          python - <<'PY'
          from pathlib import Path

          page = Path("thelma-executive-portfolio-github-ready/dist/classic/index.html")
          html = page.read_text()
          banner = (
              '<div style="position:relative;z-index:9999;text-align:center;padding:11px 16px;'
              'background:#29345E;font:500 14px Arial,sans-serif">'
              '<a href="/TAP/" style="color:#fff;text-decoration:underline;text-underline-offset:3px">'
              'View the refreshed portfolio</a></div>'
          )
          opening = html.find("<body")
          opening_end = html.find(">", opening)
          if opening < 0 or opening_end < 0:
              raise SystemExit("Could not find the body tag in the classic page.")
          updated = html[:opening_end + 1] + banner + html[opening_end + 1:]
          page.write_text(updated)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: thelma-executive-portfolio-github-ready/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
