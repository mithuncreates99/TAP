name: Validate independent portfolio preview

on:
  push:
    branches:
      - "preview/independent-public-demos"
    paths:
      - "thelma-executive-portfolio-github-ready/**"
      - ".github/workflows/preview-independent-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "preview-validation"
  cancel-in-progress: true

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: thelma-executive-portfolio-github-ready
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser tests
        working-directory: thelma-executive-portfolio-github-ready
        run: npx playwright install --with-deps chromium

      - name: Build preview
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run build

      - name: Test independent demos and responsive layouts
        working-directory: thelma-executive-portfolio-github-ready
        run: npm run test:e2e
